[package]
name = "horizon-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon's Minecraft 26.3 server: Leaf (Paper fork) ported from Java to Rust, with the Bukkit/Paper API implemented on the game's own types"

[lib]
path = "src/lib.rs"

[[bin]]
name = "horizon-server"
path = "src/main.rs"

[dependencies]
indexmap = "2"
uuid = { version = "1", features = ["v3", "v4"] }
parking_lot = "0.12"
dashmap = "6"
crossbeam = "0.8"
regex = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

# Java's int arithmetic wraps; the port writes it with plain operators.
# (overflow-checks is off for this crate in the workspace's profiles.)
