[package]
name = "horizon-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon's Minecraft 26.3 server, run as Paper and Leaf run: server.properties, config/paper-global.yml, a console, logs/"

[[bin]]
name = "horizon-server"
path = "src/main.rs"

[dependencies]
# The game without sound or controllers (the server half moves here step by step: docs/crates.md).
horizon-client = { path = "../horizon-client", default-features = false }
# The plugin API (Bukkit-shaped), and the plugins this server is built with (src/plugins.rs).
horizon-server-api = { path = "../horizon-server-api" }
horizon-plugin-example = { path = "../horizon-plugin-example", optional = true }
log = "0.4"

[features]
# The example plugin (crates/horizon-plugin-example): the plugin tests run it; a real server leaves it out.
example-plugin = ["dep:horizon-plugin-example"]

[lints]
workspace = true
