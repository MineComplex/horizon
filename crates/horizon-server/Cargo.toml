[package]
name = "horizon-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon's Minecraft 26.3 server: Leaf (Paper fork) ported from Java to Rust, with the Bukkit/Paper API implemented on the game's own types"

[lib]
path = "src/lib.rs"

[[bin]]
name = "horizon-server"
path = "src/main.rs"

[dependencies]
libm = "=0.2.16"
xxhash-rust = { version = "0.8.19", features = ["xxh32"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
tracing = "0.1"
thiserror = "2"
byteorder = "1.5.0"
rsa_public_encrypt_pkcs1 = "0.4.0"
indexmap = "2"
uuid = { version = "1", features = ["v3", "v4"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded floats, as Java's parsers give (registry data: registry/nbt_json.rs);
# raw_value: number tokens kept as text, so floats round once from the decimal as Gson's do (worldgen/codec.rs).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
rand = { version = "0.10.0", features = ["sys_rng"] }
rsa = { version = "0.10.0-rc.17", features = ["sha2"] }
aes = "0.8.4"
cfb8 = "0.8.1"
sha1 = "0.11.0-rc.5"
sha2 = "0.11.0-rc.5"
md-5 = "0.10.6"
# server.properties: the format is read by java-properties (checked against the JDK in
# server/properties_file.rs); encoding_rs is the decoder it takes; jiff gives the local date header.
java-properties = "2.0.0"
encoding_rs = "0.8.42"
jiff = "0.2.38"
num-bigint = "0.4.6"
# network: tokio replaces Netty (TCP, tasks, channels), bytes its buffers; hmac verifies Velocity's
# forwarding signature (HMAC-SHA256 over the crate's sha2).
tokio = { version = "1.53", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros", "signal"] }
bytes = "1.12"
hmac = "0.13"
# The YAML configs (paper-global.yml, spigot.yml, purpur.yml, leaf-global.yml): why saphyr is in
# server/config/yaml.rs. Its default `encoding` feature pins encoding_rs < 0.8.40, which conflicts with
# the line above, and is not needed (the files are UTF-8 text).
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.3.3"
# SnakeYAML's implicit-type patterns, used as SnakeYAML 2.6 prints them (server/config/yaml.rs).
regex = "1"
# The vanilla server jar (server/vanilla_jar.rs): the version the rest of the workspace uses.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Leaf's command-line options (joptsimple in Java), and the binary's console log.
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

# session.lock: the POSIX record lock (`fcntl(F_SETLK)`) Java's FileChannel.tryLock takes on Unix,
# so a Java server and this one see each other's lock (world/level_storage.rs); std's File::try_lock
# is flock(2) there, which fcntl locks ignore.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

