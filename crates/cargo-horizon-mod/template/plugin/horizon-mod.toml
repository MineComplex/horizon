id = "{id}"
name = "{name}"
version = "0.1.0"
description = ""
authors = []
# A plugin: Bukkit-style server code (docs/plugins.md).
api = "0.4"
side = "server"
capabilities = ["plugin"]
# Plugins enabled before this one (it stays off without them), and those
# enabled before it when installed.
depend = []
softdepend = []

[commands.hello]
description = "Greets you"
usage = "/<command> [name]"
aliases = ["hi"]
permission = "{id}.hello"

[permissions."{id}.hello"]
description = "Use /hello"
default = true
