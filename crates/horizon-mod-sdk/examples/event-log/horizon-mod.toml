id = "event_log"
name = "Event Log"
version = "0.1.0"
description = "Logs every event a plugin can hear to the console; /eventlog cancel <kind> cancels a kind, /eventlog rewrite rewrites chat and commands. For plugin authors and tests."
authors = ["Horizon"]
api = "0.4"
side = "server"
capabilities = ["plugin"]

[commands.eventlog]
description = "Cancels kinds of events, or stops"
usage = "/<command> cancel <kind> | allow <kind> | rewrite <on|off> | list"
permission = "eventlog.use"

[permissions."eventlog.use"]
default = "op"
