# Every kind is heard and logged; named kinds are cancelled.
[[step]]
join = ["Steve"]
expect.console = ["EVENT player-login Steve", "EVENT player-join Steve first=true"]

[[step]]
op = ["Steve"]
command = "eventlog cancel block-break"
expect.told-contains = ["Steve: cancelling block-break"]

[[step]]
break = { x = 1, y = 60, z = 1 }
expect.cancelled = true
expect.console = ["EVENT block-break Steve minecraft:stone 1 60 1 (cancelled)"]

[[step]]
command = "eventlog rewrite on"
expect.told-contains = ["Steve: rewrite true"]

[[step]]
chat = "quiet please"
expect.chat = ["<Steve> QUIET PLEASE"]

[[step]]
complete = "eventlog cancel player-c"
expect.completions = ["player-chat", "player-command", "player-changed-world"]
