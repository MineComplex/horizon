id = "essentials"
name = "Essentials"
version = "0.1.0"
description = "Spawn, homes, heal, fly, game modes, broadcasts, a menu, a sidebar, chat format and spawn protection: the plugin API in one example."
authors = ["Horizon"]
api = "0.4"
side = "server"
capabilities = ["plugin"]
website = "https://playhorizon.dev"

[commands.spawn]
description = "Teleports you to the spawn"
usage = "/<command>"
permission = "essentials.spawn"

[commands.setspawn]
description = "Sets the spawn where you stand"
usage = "/<command>"
permission = "essentials.setspawn"

[commands.heal]
description = "Heals you or another player"
usage = "/<command> [player]"
permission = "essentials.heal"

[commands.fly]
description = "Toggles flight"
usage = "/<command>"
permission = "essentials.fly"

[commands.gamemode]
description = "Changes your game mode"
usage = "/<command> <survival|creative|adventure|spectator> [player]"
aliases = ["gm"]
permission = "essentials.gamemode"
permission-message = "&cYou may not change game modes."

[commands.broadcast]
description = "Says something to everyone"
usage = "/<command> <message>"
aliases = ["bc"]
permission = "essentials.broadcast"

[commands.menu]
description = "Opens the server menu"
usage = "/<command>"

[commands.sethome]
description = "Remembers your home"
usage = "/<command>"

[commands.home]
description = "Takes you home"
usage = "/<command>"

[commands.tps]
description = "Shows the server's ticks per second"
usage = "/<command>"

[permissions."essentials.spawn"]
default = true
[permissions."essentials.setspawn"]
default = "op"
[permissions."essentials.heal"]
default = "op"
[permissions."essentials.fly"]
default = "op"
[permissions."essentials.gamemode"]
default = "op"
[permissions."essentials.broadcast"]
default = "op"
[permissions."essentials.build"]
description = "Build inside the spawn's protection"
default = "op"
[permissions."essentials.admin"]
description = "Every Essentials permission"
default = "op"
children = { "essentials.setspawn" = true, "essentials.heal" = true, "essentials.fly" = true, "essentials.gamemode" = true, "essentials.broadcast" = true, "essentials.build" = true }
