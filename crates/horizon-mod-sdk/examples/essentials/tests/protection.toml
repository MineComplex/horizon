# The spawn is protected for players without essentials.build; no fall
# damage there.
[[step]]
join = ["Steve"]

[[step]]
break = { x = 3, y = 63, z = 3 }
expect.cancelled = true
expect.action-bars = ["Steve: The spawn is protected."]
expect.blocks = [{ x = 3, y = 63, z = 3, state = "minecraft:stone" }]

[[step]]
place = { x = 2, y = 64, z = 2, state = "minecraft:dirt" }
expect.cancelled = true
expect.blocks = [{ x = 2, y = 64, z = 2, state = "minecraft:air" }]

[[step]]
damage = { amount = 5.0, cause = "minecraft:fall" }
expect.cancelled = true
expect.player = { name = "Steve", health = 20.0 }

[[step]]
damage = { amount = 5.0, cause = "minecraft:lava" }
expect.cancelled = false
expect.player = { name = "Steve", health = 15.0 }

[[step]]
# Far from the spawn anyone builds.
break = { x = 100, y = 63, z = 100 }
expect.cancelled = false
expect.blocks = [{ x = 100, y = 63, z = 100, state = "minecraft:air" }]

[[step]]
op = ["Steve"]
break = { x = 3, y = 63, z = 3 }
expect.cancelled = false
expect.player = { name = "Steve", permission = "essentials.build", has-permission = true }
