# Homes and the spawn are kept in the data folder.
[[step]]
join = ["Steve"]
op = ["Steve"]

[[step]]
command = "home"
expect.told = ["Steve: You have no home: /sethome first."]

[[step]]
move = { x = 100.5, y = 70.0, z = -20.5 }
command = "sethome"
expect.told = ["Steve: Home set."]
expect.file = { "essentials/homes.txt" = "minecraft:overworld 100.5 70 -20.5" }

[[step]]
command = "spawn"
expect.player = { name = "Steve", x = 0.5, z = 0.5 }

[[step]]
command = "home"
expect.told = ["Steve: Welcome home."]
expect.player = { name = "Steve", x = 100.5, y = 70.0, z = -20.5 }

[[step]]
command = "setspawn"
expect.told = ["Steve: Spawn set."]
expect.file = { "essentials/spawn.txt" = "minecraft:overworld 100.5 70 -20.5", "essentials/config.yml" = "protection-radius: 16" }
