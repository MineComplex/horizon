# /menu opens a chest menu; its clicks are cancelled and act.
[[step]]
join = ["Steve"]
move = { x = 50.0, y = 64.0, z = 50.0 }

[[step]]
command = "menu"
expect.inventory = { player = "Steve", title = "Server menu", size = 27, slots = { "11" = { id = "compass", name = "Teleport to spawn" }, "13" = { id = "red_bed" }, "0" = { id = "gray_stained_glass_pane" } } }

[[step]]
click = { slot = 0 }
expect.cancelled = true
expect.inventory = { player = "Steve", title = "Server menu" }

[[step]]
click = { slot = 11 }
expect.cancelled = true
expect.told = ["Steve: Welcome back to the spawn."]
expect.inventory = { player = "Steve", closed = true }
expect.player = { name = "Steve", x = 0.5, z = 0.5 }

[[step]]
command = "menu"
click = { slot = 15 }
expect.told = ["Steve: You may not heal."]
