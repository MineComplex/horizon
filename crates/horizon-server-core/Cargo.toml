[package]
name = "horizon-server-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The server's half of the game: its network side, world generation binding, commands and the rules only a server runs"

[dependencies]
horizon-game = { path = "../horizon-game" }
horizon-client-core = { path = "../horizon-client-core" }
horizon-command = { path = "../horizon-command" }
horizon-core = { path = "../horizon-core" }
horizon-threads = { path = "../horizon-threads" }
horizon-world = { path = "../horizon-world", features = ["generation"] }
# Blocks and items below gameplay (re-exported: `horizon_game::items`...).
horizon-items = { path = "../horizon-items" }
horizon-assets = { path = "../horizon-assets" }
horizon-protocol = { path = "../horizon-protocol" }
# server.properties, eula.txt and the user lists (`horizon_game::server`).
horizon-server-files = { path = "../horizon-server-files" }
# Section and mob meshes are built on the CPU here (plain vertex data, no GPU): `mesher`, `mobs::render`.
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
# Velocity modern forwarding (lan::velocity).
hmac = "0.12"
# HTTPS to the Minecraft services (online-mode session checks, profiles).
ureq = { version = "2", default-features = false, features = ["tls"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
log = "0.4"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[dev-dependencies]
horizon-game = { path = "../horizon-game", features = ["test-support"] }
horizon-items = { path = "../horizon-items", features = ["test-support"] }

[lints]
workspace = true
